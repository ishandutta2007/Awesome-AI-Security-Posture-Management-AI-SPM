<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .rotate-scan {
        transform-origin: 1050px 210px;
        animation: rotateScan 12s linear infinite;
      }
      .float-orb {
        animation: floatOrb 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes rotateScan {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-18px) scale(1.08); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <g class="float-orb">
    <circle cx="150" cy="100" r="140" fill="#6366f1" opacity="0.15" filter="url(#glowPurple)" />
    <circle cx="1080" cy="300" r="160" fill="#ec4899" opacity="0.12" filter="url(#glowPurple)" />
    <circle cx="950" cy="120" r="120" fill="#06b6d4" opacity="0.16" filter="url(#glowCyan)" />
  </g>

  <!-- Dynamic Radar Scanner Graphic in Right Background -->
  <g opacity="0.6">
    <circle cx="1040" cy="210" r="130" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1040" cy="210" r="95" fill="none" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5" />
    <circle cx="1040" cy="210" r="55" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="1040" cy="210" r="6" fill="#38bdf8" />
    
    <!-- Rotating Scan Line -->
    <g class="rotate-scan" style="transform-origin: 1040px 210px;">
      <line x1="1040" y1="210" x2="1170" y2="210" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.8" />
      <polygon points="1040,210 1160,180 1170,210" fill="rgba(99, 102, 241, 0.15)" />
    </g>

    <!-- Radar Target Blips -->
    <circle cx="1090" cy="160" r="4" fill="#10b981" class="pulse-circle" />
    <circle cx="995" cy="265" r="4.5" fill="#f43f5e" class="pulse-circle" />
    <circle cx="1075" cy="245" r="3.5" fill="#38bdf8" class="pulse-circle" />
  </g>

  <!-- Foreground Content Container (Guaranteed 100% Crisp Visibility) -->
  <g transform="translate(70, 75)">
    <!-- Security Tagline Pill -->
    <g transform="translate(0, 0)">
      <rect width="365" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" class="tagline-text">🛡️ AI Security Posture Management</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" class="title-text">Awesome <tspan fill="url(#accentGrad)">AI-SPM</tspan></text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" class="subtitle-text">Curated Architectures, Enterprise Platforms &amp; Open-Source Security Tools</text>
    </g>

    <!-- Core Pillar Badges / Dynamic Pills -->
    <g transform="translate(0, 155)">
      <!-- Pill 1: Shadow AI Discovery -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="10" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" />
        <circle cx="18" cy="18" r="5" fill="#6366f1" />
        <text x="32" y="23" class="pill-text">🔍 Shadow AI Discovery</text>
      </g>

      <!-- Pill 2: Model Supply Chain -->
      <g transform="translate(195, 0)">
        <rect width="195" height="36" rx="10" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />
        <circle cx="18" cy="18" r="5" fill="#a855f7" />
        <text x="32" y="23" class="pill-text">📦 Model Supply Chain</text>
      </g>

      <!-- Pill 3: Runtime Guardrails -->
      <g transform="translate(405, 0)">
        <rect width="185" height="36" rx="10" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.2" />
        <circle cx="18" cy="18" r="5" fill="#06b6d4" />
        <text x="32" y="23" class="pill-text">⚡ Runtime Guardrails</text>
      </g>

      <!-- Pill 4: Governance & Compliance -->
      <g transform="translate(605, 0)">
        <rect width="200" height="36" rx="10" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2" />
        <circle cx="18" cy="18" r="5" fill="#ec4899" />
        <text x="32" y="23" class="pill-text">📋 AI Governance &amp; RMF</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Stripe with Gradient -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" />
</svg>
